name: Go Tests

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ./go.mod

      - name: Get
        run: go get ./...

      - name: Build
        run: go build ./...

      - name: Run Tests
        run: go test -v ./...
        env:
          QDRANT_SERVERLESS_URL: ${{ secrets.QDRANT_SERVERLESS_URL }}
          QDRANT_SERVERLESS_API_KEY: ${{ secrets.QDRANT_SERVERLESS_API_KEY }}
